<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <!-- Cotton stock: noise treated as a height map and lit from the upper left. -->
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="5" seed="7" stitchTiles="stitch" result="noise"/>
    <feDiffuseLighting in="noise" surfaceScale="0.55" diffuseConstant="1" lighting-color="#ffffff">
      <feDistantLight azimuth="225" elevation="68"/>
    </feDiffuseLighting>
  </filter>
  <rect width="100%" height="100%" filter="url(#paper)"/>
</svg>
