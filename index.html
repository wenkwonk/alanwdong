  <script>
    // Play the card-case intro only when motion is welcome and WebGL exists.
    // If js/intro.js has not started within 3s (slow CDN, error), show the card.
    (function () {
      var root = document.documentElement;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      try {
        if (!document.createElement('canvas').getContext('webgl2')) return;
      } catch (e) { return; }
      root.classList.add('intro');
      window.introFailsafe = setTimeout(function () { root.classList.remove('intro'); }, 3000);
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
