<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alan Dong</title>
  <meta name="description" content="Alan Dong builds computer vision and machine learning pipelines for biological and medical images.">
  <meta name="color-scheme" content="light dark">
  <link rel="preload" href="assets/fonts/inter-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main>
    <header class="hero">
      <h1 class="visually-hidden">Alan Dong</h1>
      <div class="stage">
        <canvas id="name-canvas" role="img" aria-label="Alan Dong"></canvas>
      </div>
      <p class="subtitle">ML for biological images.</p>
      <p id="classification" class="classification" hidden>Classification: Alan · 99.2%</p>

      <div class="stack-row">
        <ol id="chips" class="chips" aria-label="Applied layers"></ol>
        <button id="reset" class="reset" type="button" hidden>Reset</button>
      </div>

      <aside class="palette" aria-labelledby="palette-hint">
        <p id="palette-hint" class="hint">
          <span class="hint-drag">Drag a layer onto my name.</span>
          <span class="hint-tap">Tap a layer to apply it.</span>
        </p>
        <div id="tiles" class="tiles"></div>
      </aside>
    </header>

    <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
